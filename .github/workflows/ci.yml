name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Apple silicon: the platform Geis is built and tested on.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Window (TypeScript)
        run: |
          npx tsc --noEmit
          npx eslint src --max-warnings 0
          npx vitest run
      - name: Core (Rust)
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
