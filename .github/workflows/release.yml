name: Release

# Push a tag like v0.1.0 and a draft release appears with the macOS app attached;
# publish it from the Releases page once it has been looked at.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned until an Apple Developer ID is set up. To sign and notarise, add
          # these as repository secrets and they are picked up here:
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Geis ${{ github.ref_name }}
          releaseBody: |
            The macOS app, for Apple silicon. Download the .dmg and drag Geis to Applications.

            This build is not signed by Apple yet, so macOS stops it the first time:
            right-click Geis in Applications and choose Open, or run
            `xattr -dr com.apple.quarantine /Applications/Geis.app` once.
          releaseDraft: true
          args: --bundles dmg
