[package]
name = "geis"
version = "0.1.0"
license = "MIT"
authors = ["Sanggeun Park"]
description = "Structure prediction workbench"
edition = "2021"
rust-version = "1.77"

[lib]
name = "geis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = "0.4"
glob = "0.3.4"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.5"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util"] }
toml = "1.0.7"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.23.1"
sha2 = "0.10"
wgpu = { version = "30.0.2", default-features = false, features = ["metal", "wgsl"] }
pollster = "1.0.1"
bytemuck = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[profile.dev]
# Dependencies are compiled once and rarely touched; our own crate stays fast to rebuild.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
